# R50 paper day trader — $200 ticket, $50 target, 09:30–16:00 ET.
# This file never places live broker orders. Paper mode only.

risk_dollars: 50.0
reward_dollars: 50.0
capital_per_trade: 200.0
starting_cash: 50000.0
max_positions: 6
max_daily_loss: 200.0
max_daily_trades: 12
slippage_bps: 2.0
commission_per_fill: 0.0
cash_hours_only: true
wait_for_session: false

# Flatten the book before the 16:00 ET cash close.
flatten_minutes_before_close: 5

enabled_assets:
  stock: true
  option: true
  crypto: true
  metal: true

watchlist:
  stock: [SPY, QQQ, AAPL, NVDA, TSLA, AMD, MSFT]
  option: [SPY, QQQ]
  crypto: [BTC-USD, ETH-USD, SOL-USD]
  metal: [GLD, SLV]

strategy:
  bar_minutes: 5
  opening_bars: 3
  min_range_pct: 0.001
  volume_mult: 1.15
  atr_period: 14
  atr_stop_mult: 1.0
  # Skip setups where 1 lot would risk more than this multiple of $50.
  max_risk_overshoot: 1.0

options:
  min_delta: 0.35
  max_delta: 0.65
  assumed_delta: 0.50
  multiplier: 100

dashboard:
  host: 0.0.0.0
  port: 8000
  bar_interval_ms: 160
