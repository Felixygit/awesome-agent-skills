[project]
name = "r50-daytrader"
version = "0.1.0"
description = "Paper day-trading bot targeting $50 profit with $50 risk across stocks, options, crypto, and metals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
r50 = "daytrader.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["daytrader*"]

[tool.setuptools.package-data]
daytrader = ["dashboard/static/*", "dashboard/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
